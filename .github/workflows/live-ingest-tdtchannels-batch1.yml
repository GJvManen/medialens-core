name: Live TDTChannels batch 1

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  live-ingest:
    if: ${{ github.head_ref == 'live-ingest-tdtchannels-batch1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Import TDTChannels candidates
        run: node scripts/import-source-expansion.mjs . --feed=tdtchannels-tv
      - name: Live probe controlled batch
        run: node scripts/probe-source-expansion.mjs . --live --concurrency=12 --timeout=6000 --limit=120
      - name: Apply approval gate
        run: node scripts/approve-source-expansion.mjs .
      - name: Promote approved live candidates
        run: node scripts/promote-source-expansion.mjs . --write
      - name: Verify resulting catalog
        run: npm run verify
      - name: Print live batch summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = {
            import: 'data/reports/source-expansion-import-report.json',
            probe: 'data/reports/source-expansion-probe-report.json',
            approval: 'data/reports/source-expansion-approval-report.json',
            promotion: 'data/reports/source-expansion-promotion-report.json'
          };
          for (const [label, file] of Object.entries(files)) {
            const x = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`LIVE_BATCH_SUMMARY ${label}`, JSON.stringify({
              candidate_count: x.candidate_count,
              checked: x.checked,
              actively_probed: x.actively_probed,
              passed: x.passed,
              blocked: x.blocked,
              considered: x.considered,
              approved: x.approved,
              held: x.held,
              eligible_after_promotion_gate: x.eligible_after_promotion_gate,
              published: x.published
            }));
          }
          NODE
      - name: Commit live evidence and promoted catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_MANIFEST.json data/SOURCE_MANIFEST.json data/sources.json data/official-starter-catalog.json data/generated/app-catalog.json assets/starter-catalog.js
          git add data/candidates/tdtchannels-tv.candidates.json
          git add data/reports/source-expansion-import-report.json data/reports/source-expansion-probe-report.json data/reports/source-expansion-approval-report.json data/reports/source-expansion-promotion-report.json
          if git diff --cached --quiet; then
            echo "No live ingest changes to commit."
            exit 0
          fi
          git commit -m "Live TDTChannels batch 1 output [live-ingest-output]"
          git push origin HEAD:${{ github.head_ref }}
